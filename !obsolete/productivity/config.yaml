---
name: Super Productivity
version: 0.1.0
stage: stable
slug: productivity
description: >-
  A to-do app that helps you get organized, stay focused, and get into the flow. Simple yet powerful – designed for professionals who value clarity.
url: https://github.com/velvet-lab/hassio-addons/tree/main/productivity
arch:
  - amd64
  - aarch64
startup: services
homeassistant: 2026.1.0
init: false
apparmor: true
backup: hot
backup_exclude:
  - /data/app.err
watchdog: tcp://[HOST]:[PORT:8080]
ports:
  8080/tcp: 8080
schema:
  unsplash_key: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?

# Neo4j configuration template copied to /homeassistant/addons/neo4j/neo4j.conf
# Edit in the add-on folder; values are rendered on start.

# Network connectors
server.http.listen_address=:7474
server.https.listen_address=:7473
server.bolt.listen_address=:7687

# Data directories (rendered from container env)
server.directories.data=${NEO4J_DATA_DIR}
server.directories.logs=${NEO4J_LOGS_DIR}
server.directories.import=${NEO4J_IMPORT_DIR}

# Security
# Use default auth flow; initial password is set via neo4j-admin on first start

# JVM opts can be tuned by the user
#server.jvm.additional=-Xms512m -Xmx512m

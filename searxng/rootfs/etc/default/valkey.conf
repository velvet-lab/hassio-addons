# Valkey server configuration for the SearXNG add-on.
# Binds to loopback only; used by SearXNG for the limiter / bot protection.
bind 127.0.0.1
port 6379
protected-mode yes

daemonize no
supervised no

# Persist data under /data so it survives restarts and is included in backups.
dir /data/searxng/valkey
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"

logfile ""
loglevel warning

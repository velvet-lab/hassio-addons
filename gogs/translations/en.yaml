configuration:
  log_level:
    name: Log Level
    description: Choose the Log Level
  secret_key:
    name: Secret Key
    description: Set the secret key used to encrypt cookies and 2FA codes
  redis_enabled:
    name: Use Redis
    description: Use a Redis server (e.g. the Valkey add-on) for sessions and cache
  redis_host:
    name: Redis Host
    description: Address or IP of the Redis server (default core-valkey)
  redis_port:
    name: Redis Port
    description: Port of the Redis server (default 6379)
  redis_password:
    name: Redis Password
    description: Password of the Redis server (required when enabled)

network:
  3000/tcp: Port for the Gogs web interface and Git HTTP endpoints
---
configuration:
  log_level:
    name: Log Level
    description: >-
      Set the logging verbosity. Debug and trace levels provide detailed
      diagnostic information.
  master_key:
    name: Master Key
    description: >-
      Master key for proxy authentication (required). Generate a strong random
      key with 'openssl rand -hex 32' (64 hex chars / 256-bit). This key
      authenticates all requests to the proxy and is stored encrypted by
      Home Assistant.
  ui_enable:
    name: Enable Dashboard UI
    description: >-
      Enable or disable the built-in web dashboard. The dashboard provides
      monitoring, management, and configuration tools. Access at
      http://homeassistant.local:4000 (default: enabled).
  use_mysql:
    name: Use MySQL/MariaDB
    description: >-
      Use MySQL/MariaDB from another add-on (e.g. the official MariaDB add-on)
      instead of SQLite. Requires the MariaDB add-on to be installed and
      running. The database 'litellm' is created automatically (default:
      false).
  redis_host:
    name: Redis Host
    description: >-
      Redis/Valkey server hostname or IP address (optional). Leave empty to
      disable Redis caching and rate limiting. When set, redis_password is
      also required.
  redis_port:
    name: Redis Port
    description: >-
      Redis/Valkey server port (default: 6379).
  redis_password:
    name: Redis Password
    description: >-
      Redis/Valkey authentication password (optional). Required when redis_host
      is set.
  redis_db:
    name: Redis Database
    description: >-
      Redis/Valkey database number (default: 0). Use different numbers for
      different applications to avoid key collisions.
  store_model_in_db:
    name: Store Model Config in Database
    description: >-
      Store model configuration in the database instead of the config.yaml
      file. Useful for dynamic model management via the API (default: false).

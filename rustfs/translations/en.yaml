configuration:
  log_level:
    name: Log Level
    description: Choose the log level for the service (e.g., info, debug, warning, error).
  access_key:
    name: Access Key
    description: The access key for authenticating with the RustFS service.
  secret_key:
    name: Secret Key
    description: The secret key for authenticating with the RustFS service.
  console_enable:
    name: Console Enable
    description: Enable or disable the RustFS web console.

network:
  9000/tcp: Service port
  9001/tcp: Web console port
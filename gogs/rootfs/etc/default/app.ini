# Gogs server configuration
# This template is copied to /homeassistant/addons/gogs/app.ini on first
# start, where you can edit it. It overlays the shipped Gogs defaults, so it
# only needs the keys you actually want to change. Values of the form
# ${VAR} are expanded from the add-on environment at start; Gogs also expands
# any ${VAR} it does not know itself.
#
# Full reference: https://gogs.io/docs/use/configuration.html
#
# IMPORTANT: EXTERNAL_URL below is used for login redirects and clone URLs.
# If you access the add-on from a different host than the one that runs Home
# Assistant, set DOMAIN and EXTERNAL_URL to match the address you use in the
# browser (e.g. https://git.example.com/ if you add a reverse proxy).

; The brand name of the application, can be your company or team name.
; Rendered from the add-on instance_name option; the editable file here only
; overrides it if you change this line (and restart the add-on).
BRAND_NAME = ${GOGS_INSTANCE_NAME}

# Run as root, matching the user the add-on container runs the process as.
RUN_MODE = prod
RUN_USER = root

[server]
; The public-facing URL for the application. When the add-on external_url option
; is set (e.g. for a reverse proxy), the line below becomes active and uses the
; configured URL verbatim. When unset, the line is commented out so Gogs falls
; back to its built-in default (built from PROTOCOL, DOMAIN and HTTP_PORT).
${GOGS_EXTERNAL_URL}
; The public-facing domain name for the application. It is derived from the
; external_url add-on option (the host/port without http(s):// and without any
; path), or falls back to "localhost" when external_url is unset.
DOMAIN = ${GOGS_DOMAIN}
; The protocol that is used to serve direct traffic to the application.
; Derived from the external_url option (http or https); falls back to "http".
PROTOCOL = ${GOGS_PROTOCOL}
; The address to be listened by the application.
HTTP_ADDR = 0.0.0.0
; The port number to be listened by the application.
HTTP_PORT = 3000
; The application data directory. Gogs keeps its builtin SSH server host keys
; under "<APP_DATA_PATH>/ssh" (e.g. /data/gogs/data/ssh/gogs.rsa). Pointing it
; at the persistent data folder keeps the host keys stable across restarts, so
; clients do not get a "host key changed" warning on every restart.
APP_DATA_PATH = ${GOGS_DATA_PATH}

; Whether to disable using CDN for static files regardless.
OFFLINE_MODE = true
; Whether to enable application level GZIP compression.
ENABLE_GZIP = true

; Whether to disable SSH access to the application entirely.
DISABLE_SSH = false
; Whether to start a builtin SSH server.
START_SSH_SERVER = true
; The host name shown in SSH clone URLs (e.g. git@<SSH_DOMAIN>:22/...). It is
; derived from the external_url option, matching the public host users clone from.
SSH_DOMAIN = ${GOGS_SSH_DOMAIN}
; The port shown in clone URLs for the builtin SSH server.
SSH_PORT = 22
; The port the builtin SSH server actually listens on. Keep in sync with the
; exposed 22/tcp port mapping in config.yaml.
SSH_LISTEN_PORT = 22

[repository]
; The root path for storing managed repositories, default is "~/gogs-repositories"
ROOT = ${GOGS_REPO_ROOT}
; Whether to force every new repository to be private.
FORCE_PRIVATE = true
; Default branch name when creating new repositories.
DEFAULT_BRANCH = main

[database]
; The database backend is either "sqlite3" (built-in, default) or "mysql"
; (when the use_mysql add-on option is enabled). SQLite requires an absolute
; path; when TYPE is "mysql", HOST/NAME/USER/PASSWORD are used instead.
TYPE = ${GOGS_DB_TYPE}
# SQLite only:
PATH = ${GOGS_DB_PATH}
# MySQL/MariaDB only:
HOST = ${GOGS_DB_HOST}
NAME = ${GOGS_DB_NAME}
USER = ${GOGS_DB_USER}
PASSWORD = ${GOGS_DB_PASSWORD}
; Disable TLS/SSL for the internal MariaDB connection. Only relevant when
; TYPE is "mysql". SCHEMA (PostgreSQL only) is left unset on purpose.
SSL_MODE = disable

[security]
# A random per-install key is generated on first start. Change this if you
# want to set your own unguessable value.
SECRET_KEY = ${GOGS_SECRET_KEY}
; Lock the setup/install page. The add-on manages the whole configuration and
; the first user self-registers as admin (see [auth] DISABLE_REGISTRATION), so
; the web installer must never overwrite the add-on-managed app.ini.
INSTALL_LOCK = true

[email]
; The mailer is required: registration and notification mails need an SMTP
; server. All four values come from the corresponding add-on options.
ENABLED = ${GOGS_EMAIL_ENABLED}
; SMTP server address and port, e.g. smtp.example.com:587. From the add-on.
HOST = ${GOGS_EMAIL_HOST}
; The sender address used in outgoing mails (may include a display name).
; Comes from the add-on email_from option.
FROM = ${GOGS_EMAIL_FROM}
; The SMTP username (usually the full email address). From the add-on.
USER = ${GOGS_EMAIL_USER}
; The SMTP password. From the add-on option (stored encrypted by HA).
PASSWORD = ${GOGS_EMAIL_PASSWORD}
; Additional SMTP options can be edited here as needed, see the full reference:
;   SUBJECT_PREFIX, HELO_HOSTNAME, SKIP_VERIFY, USE_CERTIFICATE, CERT_FILE,
;   KEY_FILE, USE_PLAIN_TEXT, ADD_PLAIN_TEXT_ALT

[session]
# Sessions are kept on disk by default. When a Redis connection is configured
# via the add-on options (redis_host / redis_port / redis_password), PROVIDER
# switches to "redis" and PROVIDER_CONFIG holds the Redis connection string.
PROVIDER = ${GOGS_SESSION_PROVIDER}
PROVIDER_CONFIG = ${GOGS_SESSION_CONFIG}

[cache]
# The cache adapter defaults to "memory". When a Redis connection is
# configured, ADAPTER switches to "redis" and HOST holds the Redis connection
# string.
ADAPTER = ${GOGS_CACHE_ADAPTER}
HOST = ${GOGS_CACHE_HOST}

[lfs]
; The storage backend for uploading new objects.
STORAGE = local
; The root path to store LFS objects on local file system.
OBJECTS_PATH = ${GOGS_DATA_PATH}/lfs-objects
; The path to temporarily store LFS objects during upload verification.
OBJECTS_TEMP_PATH = ${GOGS_DATA_PATH}/tmp/lfs-objects

[attachment]
; Whether to enabled upload attachments in general.
ENABLED = true
; The path to store attachments on the file system.
PATH = ${GOGS_DATA_PATH}/attachments

[picture]
; The path to store user avatars on the file system.
AVATAR_UPLOAD_PATH = ${GOGS_DATA_PATH}/avatars
; The path to store repository avatars on the file system.
REPOSITORY_AVATAR_UPLOAD_PATH = ${GOGS_DATA_PATH}/repo-avatars
; Chinese users can use a custom avatar source, such as http://cn.gravatar.com/avatar/.
GRAVATAR_SOURCE = gravatar
; Whether to disable Gravatar, this value will be forced to be true in offline mode.
DISABLE_GRAVATAR = true
; Whether to enable federated avatar lookup uses DNS to discover avatar associated
; with emails, see https://www.libravatar.org for details.
; This value will be forced to be false in offline mode or when Gravatar is disabled.
ENABLE_FEDERATED_AVATAR = false

[admin]
; Whether to disable regular (non-admin) users to create organizations.
DISABLE_REGULAR_ORG_CREATION = true

; General settings of loggers.
[log]
; Either "Trace", "Info", "Warn", "Error", "Fatal", default is "Trace".
; Controlled by the add-on log_level option.
MODE  = console
LEVEL = ${GOGS_LOG_LEVEL}

[auth]
; Whether new users need to confirm their email address before they can sign in.
REQUIRE_EMAIL_CONFIRMATION = false
; Self-registration is enabled so the first user who signs up automatically
; becomes the administrator (Gogs grants admin to the very first account).
; No CLI bootstrap is needed.
DISABLE_REGISTRATION = false
; Whether to require captcha for user registration (only applies when
; registration is enabled).
ENABLE_REGISTRATION_CAPTCHA = false
; Whether users must sign in before browsing any page.
REQUIRE_SIGNIN_VIEW = true

[user]
; Whether to send email notifications to users on interesting events.
ENABLE_EMAIL_NOTIFICATION = true

[prometheus]
; Whether to enable Prometheus metrics.
ENABLED = false
---
name: Gogs
version: 0.14.3
stage: stable
slug: gogs
description: >-
  Gogs is a painless self-hosted Git service written in Go
url: https://github.com/velvet-lab/hassio-addons/tree/main/gogs
arch:
  - amd64
  - aarch64
host_network: false
startup: application
hassio_role: default
homeassistant: 2026.1.0
init: false
apparmor: true
map:
  - type: homeassistant_config
    read_only: false
services:
  - mysql:want
backup: hot
backup_exclude:
  - /data/app.err
watchdog: tcp://[HOST]:[PORT:3000]
ports:
  3000/tcp: 3000
  22/tcp: 22
options:
  log_level: info
  instance_name: "Gogs"
  secret_key: null
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  instance_name: "str?"
  secret_key: password
  use_mysql: bool?
  external_url: "str?"
  redis_host: "str?"
  redis_port: "port?"
  redis_password: "password?"
  redis_db: "int?"
  email_host: "str?"
  email_from: "str?"
  email_user: "str?"
  email_password: "password?"
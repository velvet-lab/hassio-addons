[davis]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 1024
clear_env = no
slowlog = /data/davis/logs/$pool.log.slow
access.log = /data/davis/logs/$pool.access.log
php_admin_value[error_log] = /data/davis/logs/$pool.error.log
php_admin_flag[log_errors] = on
php_admin_value[error_reporting] = E_ALL
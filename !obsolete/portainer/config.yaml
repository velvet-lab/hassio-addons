---
name: Portainer
version: 0.1.0
stage: stable
slug: portainer
description: >-
  Empower your team to build, operate, and scale containerized environments with precision
url: https://github.com/velvet-lab/hassio-addons/tree/main/portainer
arch:
  - amd64
  - aarch64
startup: services
homeassistant: 2026.1.0
init: false
apparmor: true
docker_api: true
tmpfs: true
backup: hot
backup_exclude:
  - /data/app.err
watchdog: tcp://[HOST]:[PORT:9000]
ports:
  9000/tcp: 9000
  8000/tcp: 8000
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?

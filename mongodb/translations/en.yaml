configuration:
  log_level:
    name: Log Level
    description: Choose the Log Level  
  admin_password:
    name: Admin Password
    description: Set the password for the MongoDB admin user. Username is 'admin'
  repl_enabled:
    name: Replica Set
    description: Enable replica set (required for MongoDB clusters)
  repl_name:
    name: Replica Set Name
    description: Set the name of the replica set (default: rs01)
  auth_enabled:
    name: Authentication
    description: Enable authentication for MongoDB

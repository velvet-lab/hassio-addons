configuration:
  log_level:
    name: Log Level
    description: Choose the log level for the service (e.g., info, debug, warning, error).
  app_timezone:
    name: Application Timezone
    description: Set the timezone for the application (e.g., UTC, America/New_York)
  birthday_reminder_offset:
    name: Birthday Reminder Offset
    description: Set the number of days before a birthday to send a reminder or leaf empty to use the default (PT9H).
  caldav_enabled:
    name: CalDAV Enabled
    description: Enable or disable CalDAV support.
  carddav_enabled:
    name: CardDAV Enabled
    description: Enable or disable CardDAV support.
  webdav_enabled:
    name: WebDAV Enabled
    description: Enable or disable WebDAV support.
  home_enabled:
    name: Home Enabled
    description: Enable or disable Home feature.
  public_calendars_enabled:
    name: Public Calendars Enabled
    description: Enable or disable public calendars.
  admin_login:
    name: Admin Login
    description: Set the administrator login username.
  admin_password:
    name: Admin Password
    description: Set the administrator login password.
  invite_from_address:
    name: Invite From Address
    description: Set the email address used for sending invitations.
  use_mysql:
    name: Use MySQL
    description: Enable or disable MySQL database. If enabled, Davis will use MariaDb addon. Take care that you install and configure it first.
  mail_host:
    name: Mail Host
    description: Set the mail server host.
  mail_port:
    name: Mail Port
    description: Set the mail server port.
  mail_username:
    name: Mail Username
    description: Set the mail server username.
  mail_password:
    name: Mail Password
    description: Set the mail server password.
  trusted_proxies:
    name: Trusted Proxies
    description: Comma-separated list of trusted proxy IP addresses.

network:
  8080/tcp: Web Interface
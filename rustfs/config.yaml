---
name: RustFS
version: 1.0.0-rc.3
stage: stable
slug: rustfs
description: >-
  High-performance enterprise-grade distributed file system and S3 compatible object storage solution written in Rust.
url: https://github.com/velvet-lab/hassio-addons/tree/main/rustfs
arch:
  - amd64
  - aarch64
startup: services
homeassistant: 2026.1.0
init: false
apparmor: true
map:
  - type: homeassistant_config
    read_only: false
backup: hot
backup_exclude:
  - /data/app.err
  - /data/logs/*
watchdog: tcp://[HOST]:[PORT:9000]
ports:
  9000/tcp: 9000
  9001/tcp: 9001
options:
  log_level: info
  access_key: admin
  secret_key: null
  console_enable: true
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  access_key: str
  secret_key: password
  console_enable: bool?

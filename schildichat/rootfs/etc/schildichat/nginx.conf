user  nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  _;

        root   /opt/schildichat-web;
        index  index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
# Gitea server configuration
# This template is copied to /homeassistant/addons/gitea/app.ini on first
# start, where you can edit it. It overlays the shipped Gitea defaults, so it
# only needs the keys you actually want to change. Values of the form
# ${VAR} are expanded from the add-on environment at start.
#
# Full reference: https://docs.gitea.com/administration/config-cheat-sheet/
#
# IMPORTANT: ROOT_URL below is used for login redirects and clone URLs.
# If you access the add-on from a different host than the one that runs Home
# Assistant, set the external_url add-on option to match the address you use in
# the browser (e.g. https://git.example.com/ if you add a reverse proxy).

APP_NAME = ${GITEA_INSTANCE_NAME}

# Run as root, matching the user the add-on container runs the process as.
RUN_MODE = prod
RUN_USER = root

[server]
; The public-facing URL for the application. When the add-on external_url option
; is set (e.g. for a reverse proxy), the line below becomes active and uses the
; configured URL verbatim. When unset, the line is commented out so Gitea falls
; back to its built-in default (built from PROTOCOL, DOMAIN and HTTP_PORT).
${GITEA_EXTERNAL_URL}
; The public-facing domain name for the application. It is derived from the
; external_url add-on option (the host/port without http(s):// and without any
; path), or falls back to "localhost" when external_url is unset.
DOMAIN = ${GITEA_DOMAIN}
; The protocol that is used to serve direct traffic to the application.
; This remains "http" because the add-on listens on plain HTTP behind the HA
; reverse proxy; TLS (https) is terminated by the proxy. Only the public
; ROOT_URL above carries the https:// scheme.
PROTOCOL = http
; The address to be listened by the application.
HTTP_ADDR = 0.0.0.0
; The port number to be listened by the application.
HTTP_PORT = 3000
; The application data directory. Gitea keeps its builtin SSH server host keys
; under "<APP_DATA_PATH>/ssh" (e.g. /data/gitea/data/ssh/gitea.rsa). Pointing it
; at the persistent data folder keeps the host keys stable across restarts.
APP_DATA_PATH = ${GITEA_DATA_PATH}
; Detect the public URL from request headers. Kept as Gitea's default so the
; Home Assistant reverse proxy (Host/X-Forwarded-Proto) is honoured.
PUBLIC_URL_DETECTION = auto

; Whether to disable using CDN for static files and Gravatar.
OFFLINE_MODE = true
; Whether to enable application level GZIP compression.
ENABLE_GZIP = true

; Whether to disable SSH access to the application entirely.
DISABLE_SSH = false
; Whether to start a builtin SSH server.
START_SSH_SERVER = true
; The host name shown in SSH clone URLs (e.g. git@<SSH_DOMAIN>:22/...). It is
; derived from the external_url option, matching the public host users clone from.
SSH_DOMAIN = ${GITEA_SSH_DOMAIN}
; The port shown in clone URLs for the builtin SSH server.
SSH_PORT = 22
; The port the builtin SSH server actually listens on. Keep in sync with the
; exposed 22/tcp port mapping in config.yaml.
SSH_LISTEN_PORT = 22

[repository]
; The root path for storing managed repositories, default is "{APP_DATA_PATH}/gitea-repositories"
ROOT = ${GITEA_REPO_ROOT}
; Whether to force every new repository to be private.
FORCE_PRIVATE = true
; Default branch name when creating new repositories.
DEFAULT_BRANCH = main

[database]
; The database backend is either "sqlite3" (built-in, default) or "mysql"
; (when the use_mysql add-on option is enabled). SQLite requires an absolute
; path; when DB_TYPE is "mysql", HOST/NAME/USER/PASSWD are used instead.
DB_TYPE = ${GITEA_DB_TYPE}
# SQLite only:
PATH = ${GITEA_DB_PATH}
# MySQL/MariaDB only:
HOST = ${GITEA_DB_HOST}
NAME = ${GITEA_DB_NAME}
USER = ${GITEA_DB_USER}
PASSWD = ${GITEA_DB_PASSWORD}
; Disable TLS/SSL for the internal MariaDB connection. Only relevant when
; DB_TYPE is "mysql".
SSL_MODE = disable

[security]
; The global secret key, used to encrypt sensitive data like 2FA secrets and
; cookies. A random per-install key would normally be generated, but the add-on
; requires it as an option so it stays stable across restarts. Change this if
; you want to set your own unguessable value.
SECRET_KEY = ${GITEA_SECRET_KEY}
; Lock the setup/install page. The add-on manages the whole configuration and
; the first user self-registers as admin (see [service] DISABLE_REGISTRATION),
; so the web installer must never overwrite the add-on-managed app.ini.
INSTALL_LOCK = true
; Internal token used to validate communication within Gitea (e.g. git hooks
; and LFS). Required because the web installer that would normally generate it
; is disabled. Provide a value generated with "gitea generate secret INTERNAL_TOKEN".
INTERNAL_TOKEN = ${GITEA_INTERNAL_TOKEN}

[mailer]
; SMTP mail configuration. All values are required (see the add-on options).
; The protocol (smtp/smtps/smtp+starttls) is inferred from the SMTP_PORT.
ENABLED = ${GITEA_EMAIL_ENABLED}
SMTP_ADDR = ${GITEA_EMAIL_HOST}
SMTP_PORT = ${GITEA_EMAIL_PORT}
USER = ${GITEA_EMAIL_USER}
PASSWD = ${GITEA_EMAIL_PASSWORD}
FROM = ${GITEA_EMAIL_FROM}

[session]
; Session engine provider: "file" (default) or "redis" (when Redis is configured
; via the add-on options). For redis, PROVIDER_CONFIG is the connection string.
PROVIDER = ${GITEA_SESSION_PROVIDER}
; For "file": the root path; for "redis": the connection string.
PROVIDER_CONFIG = ${GITEA_SESSION_CONFIG}

[cache]
; Cache engine adapter: "memory" (default) or "redis" (when Redis is configured).
ADAPTER = ${GITEA_CACHE_ADAPTER}
; Connection string for the redis adapter.
HOST = ${GITEA_CACHE_HOST}

[service]
; Whether new users need to confirm their email address before they can sign in.
; Disabled: the add-on enables self-registration and the mailer is only used for
; notifications.
REGISTER_EMAIL_CONFIRM = false
; Self-registration is enabled so the first user who signs up automatically
; becomes the administrator (Gitea grants admin to the very first account).
; No CLI bootstrap is needed.
DISABLE_REGISTRATION = false
; Whether users must sign in before browsing any page.
REQUIRE_SIGNIN_VIEW = true
; Send notification mails to watchers (requires the configured mailer).
ENABLE_NOTIFY_MAIL = true

[log]
; Controlled by the add-on log_level option.
MODE  = console
LEVEL = ${GITEA_LOG_LEVEL}

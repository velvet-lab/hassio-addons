configuration:
  log_level:
    name: Log Level
    description: Choose the Log Level
  secret_key:
    name: Secret Key
    description: Set the secret key used to encrypt cookies and 2FA codes
  redis_host:
    name: Redis Host
    description: Address of the Redis server used for sessions and cache
  redis_port:
    name: Redis Port
    description: Port of the Redis server (default 6379)
  redis_password:
    name: Redis Password
    description: Password of the Redis server

network:
  3000/tcp: Port for the Gogs web interface and Git HTTP endpoints
configuration:
  log_level:
    name: Log Level
    description: Choose the Log Level
  api_key:
    name: API Key
    description: Set the API key for the Qdrant API and Web UI
  read_only_api_key:
    name: Read-Only API Key
    description: Set an optional read-only API key for the Qdrant API

network:
  6333/tcp: HTTP API port for Qdrant
  6334/tcp: gRPC API port for Qdrant
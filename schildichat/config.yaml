---
name: SchildiChat
version: 1.0.0
stage: stable
slug: schildichat
description: >-
  SchildiChat is a feature-rich messenger for Matrix based on Element with some extras and tweaks.
url: https://github.com/velvet-lab/hassio-addons/tree/main/conduit
arch:
  - amd64
  - aarch64
codenotary: info@velvet-lab.org
host_network: false
startup: system
hassio_role: default
hassio_api: true
homeassistant: 2026.1.0
init: false
map:
  - type: homeassistant_config
    read_only: false
apparmor: true
backup: cold
backup_exclude:
  - /data/app.err
watchdog: tcp://[HOST]:[PORT:8080]
ports:
  8080/tcp: 8080
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?

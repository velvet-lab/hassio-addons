---
name: VoceChat
version: 1.2.2
stage: stable
slug: vocechat
description: >-
  VoceChat is a superlight Rust powered chat app, API and SDK that prioritizes private hosting. Build your own in-app messaging feature with VoceChat!
url: https://github.com/velvet-lab/hassio-addons/tree/main/vocechat
arch:
  - amd64
  - aarch64
codenotary: info@velvet-lab.org
host_network: true
startup: system
homeassistant: 2025.05.5
init: false
advanced: true
apparmor: true
panel_admin: true
backup: cold
backup_exclude:
  - "/data/app.err"
watchdog: tcp://[HOST]:3000
webui: http://[HOST]:[PORT:3000]
map:
  - type: homeassistant_config
    read_only: false
  - type: addon_config
    read_only: false
ports:
  3000/tcp: 3000
schema:
  domain: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  token_expiry_seconds: int?
  refresh_token_expiry_seconds: int?
  magic_token_expiry_seconds: int?
  template_register_by_email: str?
  template_login_by_email: str?
    
    
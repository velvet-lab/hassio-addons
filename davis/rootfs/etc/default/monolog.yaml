monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: ${DAVIS_MONOLOG_LEVEL}
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50
        nested:
            type: stream
            path: "%env(resolve:LOG_FILE_PATH)%"
            level: ${DAVIS_MONOLOG_LEVEL}
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
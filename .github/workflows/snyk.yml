name: Snyk analysis
on: push

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - uses: snyk/actions/setup@master

      - name: Snyk test
        run: snyk test
        env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


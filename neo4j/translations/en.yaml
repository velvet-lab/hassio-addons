configuration:
  log_level:
    name: Log level
    description: Controls the add-on log verbosity
  usage_report_enabled:
    name: Usage reporting
    description: Enable sending usage reports to Neo4j
  apoc_enabled:
    name: APOC plugin
    description: Download and enable APOC plugin at startup when true
  dbms_security_procedures_unrestricted:
    name: Procedures unrestricted
    description: Comma-separated list of procedures to allow unrestricted

network:
  7474/tcp: HTTP API port for Neo4j
  7473/tcp: Optional HTTPS port for Neo4j
  7687/tcp: Required Bolt protocol port for Neo4j Browser/Admin access

---
name: OpenBao (experimental)
version: 2.6.2
stage: experimental
slug: openbao
description: >-
  OpenBao is an open source secret management tool for storing and distributing secrets, certificates and keys
url: https://github.com/velvet-lab/hassio-addons/tree/main/openbao
arch:
  - amd64
  - aarch64
host_network: false
startup: system
hassio_role: default
homeassistant: 2026.1.0
init: false
apparmor: true
backup: hot
backup_exclude:
  - /data/app.err
watchdog: tcp://[HOST]:[PORT:8200]
ports:
  8200/tcp: 8200
options:
  log_level: info
  config: |
    # OpenBao server configuration
    # Learn more: https://openbao.org/docs/configuration

    # Enable the built-in Web UI
    ui = true

    # Server log level. This is only a default — the add-on overrides it at
    # start via the BAO_LOG_LEVEL environment variable, which is mapped from
    # the add-on's `log_level` option. Valid values: trace, debug, info,
    # warn, err
    log_level = "info"

    # File storage backend for persistent data
    storage "file" {
      path = "/data/openbao/file"
    }

    # HTTP listener (TLS is terminated by the add-on ingress)
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  config:
    type: str
    multi_line: true
